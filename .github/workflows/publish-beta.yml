name: Publish beta

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: npm-beta
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - name: Use an npm CLI that supports trusted publishing and dist-tags
        run: npm install --global npm@^12.2.0

      - name: Install
        run: |
          npm ci
          npm ci --prefix ui

      - name: Test
        run: npm test

      - name: Build
        run: |
          npm run build
          npm run build --prefix ui

      - name: Publish the next 0.1.0 beta
        run: |
          version=$(node .github/next-beta-version.mjs)
          echo "publishing ${version}"
          # setup-node and the GitHub token must not authenticate this publish.
          # Trusted publishing uses the OIDC token only when NODE_AUTH_TOKEN is unset.
          # The latest dist-tag needs the same OIDC path and the npm trusted
          # publisher's "Allow npm dist-tag" permission.
          unset NODE_AUTH_TOKEN
          for attempt in 1 2 3 4 5; do
            set +e
            log=$(npm publish --tag beta --access public 2>&1)
            code=$?
            set -e
            printf '%s\n' "$log"
            if [ "$code" -eq 0 ]; then
              version=$(node -p "require('./package.json').version")
              # OIDC trusted publishing can manage dist-tags when the npm trusted
              # publisher allows it. The registry may need a moment before it
              # accepts a tag for the version that was just published.
              tagged=no
              for attempt in 1 2 3 4 5 6; do
                if npm dist-tag add "@thready-web/dsh-bot-plugin@${version}" latest; then
                  tagged=yes
                  break
                fi
                sleep 15
              done
              if [ "$tagged" != yes ]; then
                echo "Could not point latest at ${version}." >&2
                echo "Enable 'Allow npm dist-tag' on the npm trusted publisher for this workflow." >&2
                exit 1
              fi
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add package.json package-lock.json
              git diff --cached --quiet || git commit -m "release: ${version} [skip ci]"
              git push origin HEAD
              exit 0
            fi
            if ! printf '%s\n' "$log" | grep -q 'E409'; then
              exit "$code"
            fi
            echo "That beta is already staged or published. Trying the next one."
            node .github/next-beta-version.mjs --bump
          done
          exit 1

      - name: Publish the GitHub package and release
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' >> .npmrc
          npm pkg set publishConfig.access=restricted
          npm publish --registry https://npm.pkg.github.com --access restricted
          version=$(node --input-type=module -e "import {readFileSync} from 'node:fs'; process.stdout.write(JSON.parse(readFileSync('package.json','utf8')).version)")
          gh release create "v${version}" \
            --title "v${version}" \
            --notes "Beta published to npm as \`@thready-web/dsh-bot-plugin@${version}\`." \
            --prerelease
